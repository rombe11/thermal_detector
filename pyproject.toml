[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-board"
version = "0.1.0"
description = "Real-time sub-millimetre metrology of a dense LWIR thermal calibration board"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python>=4.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=13"]
qt = ["PySide6>=6.6"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pre-commit>=3.7",
]

[project.scripts]
thermal-board = "thermal_board.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: full-resolution end-to-end validation against ground truth"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools", "examples"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "COM812",
    "ISC001",
    "CPY001",
    "ANN401",
    "FBT001",
    "FBT002",
    "TRY003",
    "EM101",
    "EM102",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "INP001", "SLF001"]
"tools/**" = ["INP001"]
"examples/**" = ["INP001"]

[tool.ruff.lint.pylint]
max-args = 7
max-statements = 10

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["thermal_board"]

[[tool.mypy.overrides]]
module = ["scipy.*", "cv2.*"]
ignore_missing_imports = true
